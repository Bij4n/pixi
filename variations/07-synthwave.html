<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixi — Synthwave</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Orbitron',system-ui,sans-serif;background:#0d0221;color:#fff;overflow-x:hidden}
.grid-floor{position:fixed;bottom:0;left:-50%;right:-50%;height:50vh;background:linear-gradient(to bottom,transparent 0%,#0d0221 30%),repeating-linear-gradient(90deg,rgba(255,45,149,.15) 0,rgba(255,45,149,.15) 1px,transparent 1px,transparent 60px),repeating-linear-gradient(0deg,rgba(255,45,149,.15) 0,rgba(255,45,149,.15) 1px,transparent 1px,transparent 60px);transform:perspective(400px) rotateX(60deg);transform-origin:center bottom}
.sun{position:fixed;bottom:25vh;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;background:linear-gradient(#FF2D95,#ff8c00);opacity:.6;filter:blur(2px)}
nav{position:relative;z-index:1;display:flex;justify-content:space-between;padding:24px 32px;font-size:11px;letter-spacing:3px;text-transform:uppercase}
nav a{color:#00F0FF;text-decoration:none}
.content{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:80px 24px;text-align:center}
h1{font-size:36px;font-weight:900;line-height:1.3;text-transform:uppercase;text-shadow:0 0 40px rgba(255,45,149,.5),0 0 80px rgba(255,45,149,.3)}
h1 span{color:#00F0FF;text-shadow:0 0 40px rgba(0,240,255,.5)}
p{font-family:system-ui;font-size:14px;color:rgba(255,255,255,.5);line-height:1.8;margin-top:24px}
.btn{display:inline-block;margin-top:32px;padding:14px 40px;background:transparent;border:2px solid #FF2D95;color:#FF2D95;text-decoration:none;font-size:12px;letter-spacing:3px;text-transform:uppercase;transition:.3s;box-shadow:0 0 20px rgba(255,45,149,.3)}
.btn:hover{background:#FF2D95;color:#fff;box-shadow:0 0 40px rgba(255,45,149,.6)}
.steps{position:relative;z-index:1;max-width:500px;margin:60px auto 0;display:flex;gap:32px;justify-content:center}
.step{text-align:center;flex:1}
.step .n{color:#00F0FF;font-size:24px;font-weight:700;text-shadow:0 0 20px rgba(0,240,255,.5)}
.step p{font-family:system-ui;font-size:12px;color:rgba(255,255,255,.4);margin-top:8px;line-height:1.5}
</style></head><body>
<div class="sun"></div>
<div class="grid-floor"></div>
<nav><span>PIXI</span><a href="#">Log in</a></nav>
<div class="content">
  <h1>Track every <span>pixel</span>. Sign every image.</h1>
  <p>Invisible tracking and C2PA cryptographic credentials, embedded into any image. Know who sees your work.</p>
  <a href="#" class="btn">Launch</a>
</div>
<div class="steps">
  <div class="step"><div class="n">01</div><p>Upload &amp; sign</p></div>
  <div class="step"><div class="n">02</div><p>Share anywhere</p></div>
  <div class="step"><div class="n">03</div><p>Track opens</p></div>
</div>
</body></html>
