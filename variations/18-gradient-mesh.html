<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pixi — Gradient Mesh</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        color: #fff;
        background: #1a1a2e;
        position: relative;
        overflow: hidden;
      }
      .mesh {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 20% 80%, #ff6b6b 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, #4ecdc4 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, #a855f7 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, #f59e0b 0%, transparent 40%),
          radial-gradient(circle at 20% 20%, #3b82f6 0%, transparent 40%);
        opacity: 0.7;
        animation: shift 15s ease-in-out infinite alternate;
      }
      @keyframes shift {
        0% {
          filter: hue-rotate(0deg);
        }
        100% {
          filter: hue-rotate(30deg);
        }
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: rgba(0, 0, 0, 0.4);
      }
      .content {
        position: relative;
        z-index: 2;
        max-width: 500px;
        margin: 0 auto;
        padding: 80px 24px;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 3;
        display: flex;
        justify-content: space-between;
        padding: 24px 32px;
      }
      nav span {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      nav a {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
      }
      h1 {
        font-size: 40px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -1px;
      }
      p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.8;
        margin-top: 20px;
      }
      .btn {
        display: inline-block;
        margin-top: 32px;
        background: #fff;
        color: #1a1a2e;
        padding: 14px 40px;
        border-radius: 99px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        transition: 0.2s;
      }
      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
      }
      .steps {
        margin-top: 64px;
        display: flex;
        gap: 24px;
        text-align: center;
      }
      .step {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        padding: 24px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .step .n {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .step h3 {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      .step p {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="mesh"></div>
    <div class="overlay"></div>
    <nav><span>Pixi</span><a href="#">Sign in</a></nav>
    <div class="content">
      <h1>Know where your images end up.</h1>
      <p>
        Invisible tracking and C2PA content credentials embedded into every
        image you share.
      </p>
      <a href="#" class="btn">Try it free</a>
      <div class="steps">
        <div class="step">
          <div class="n">1</div>
          <h3>Upload</h3>
          <p>Add tracking + C2PA signature</p>
        </div>
        <div class="step">
          <div class="n">2</div>
          <h3>Share</h3>
          <p>Send it anywhere</p>
        </div>
        <div class="step">
          <div class="n">3</div>
          <h3>Track</h3>
          <p>See every open</p>
        </div>
      </div>
    </div>
  </body>
</html>
